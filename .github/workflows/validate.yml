name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # External state changes without us touching the repo -- brands, HACS rules,
  # the manifest's own requirements -- so revalidate on a schedule too.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
